name: Build (Do Not Use)

on:
  workflow_call:
    inputs:
      version:
        description: Version to inject into release asset names; defaults to current stable
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 -run 'TestAvailableWorkers|TestMatch|TestCross|TestPacked' ./...

      - name: Resolve asset version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version=0.0.0
            latest_tag="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')"
            if [[ -n "$latest_tag" ]]; then
              [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable tag: $latest_tag" >&2; exit 1; }
              version="${latest_tag#v}"
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected semver MAJOR.MINOR.PATCH' >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Cache packaged executables only for exactly the same source, build rules,
      # host toolchain and asset version. The uncached test/vet/race suite above
      # still runs on every invocation, including cache hits.
      - name: Restore unchanged distribution
        id: bundle-cache
        uses: actions/cache@v4
        with:
          path: build/release
          key: jlz-bundle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.value }}-${{ hashFiles('**/*.go', 'go.mod', 'LICENSE', '.github/workflows/build.yaml') }}

      - name: Cross-compile complete distribution
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p build/release
          targets=(linux-amd64 linux-arm64 windows-amd64 windows-arm64 darwin-amd64 darwin-arm64)
          for target in "${targets[@]}"; do
            GOOS="${target%%-*}"
            GOARCH="${target##*-}"
            stage="build/stage-$target"
            mkdir -p "$stage"
            exe=jlz
            if [[ "$GOOS" == windows ]]; then exe=jlz.exe; fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$stage/$exe" .
            cp LICENSE "$stage/LICENSE"
            (cd "$stage" && zip -q -r "../release/jlz-$VERSION-$target.zip" "$exe" LICENSE)
          done
          (cd build/release && sha256sum *.zip > SHA256SUMS.txt)

      # Always validate restored archives before re-publishing them. This also
      # exercises the generated distribution when there was no cache hit.
      - name: Verify distribution
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          targets=(linux-amd64 linux-arm64 windows-amd64 windows-arm64 darwin-amd64 darwin-arm64)
          test "$(find build/release -maxdepth 1 -type f | wc -l)" -eq 7
          for target in "${targets[@]}"; do
            asset="build/release/jlz-$VERSION-$target.zip"
            test -s "$asset"
            unzip -tqq "$asset"
          done
          (cd build/release && sha256sum -c SHA256SUMS.txt)
          mkdir -p build/smoke
          unzip -p "build/release/jlz-$VERSION-linux-amd64.zip" jlz >build/smoke/jlz
          chmod +x build/smoke/jlz
          if ./build/smoke/jlz >build/smoke.stdout 2>build/smoke.stderr; then
            echo 'Missing CLI arguments unexpectedly succeeded' >&2
            exit 1
          fi

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*
